<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback | CHARUSAT Portal</title>
  <link rel="stylesheet" href="feedback.css" />
</head>
<body>

  <header>
    <h1>Give Your Feedback</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <div class="feedback-container slide-fade">
    <form class="feedback-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your Name" required />
      </div>

      <div class="form-group">
        <label for="email">Email ID</label>
        <input type="email" id="email" placeholder="you@charusat.edu.in.com" required />
      </div>

      <div class="form-group">
        <label for="message">Your Feedback</label>
        <textarea id="message" rows="5" placeholder="Type your message..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
