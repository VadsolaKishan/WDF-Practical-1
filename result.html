<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARUSAT Student Result Portal</title>
  <link rel="stylesheet" href="result.css">
</head>
<body>

  <header>
    <h1>CHARUSAT Student Result Portal</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <section class="results">
      <div class="results-container">
        <form>
          <div class="form-row">
            <label for="institute">Institute:</label>
            <select id="institute" name="Institute" required>
              <option value="">---Select---</option>
              <option value="CSPIT">CSPIT</option>
              <option value="CMPICA">CMPICA</option>
              <option value="DEPSTAR">DEPSTAR</option>
            </select>
          </div>

          <div class="form-row">
            <label for="branch">Branch:</label>
            <select id="branch" name="Branch" required>
              <option value="">---Select---</option>
              <option value="CE">CE</option>
              <option value="AIML">AIML</option>
              <option value="IT">IT</option>
              <option value="CSE">CSE</option>
            </select>
          </div>

          <div class="form-row">
            <label for="semester">Semester:</label>
            <select id="semester" name="Semester" required>
              <option value="">---Select---</option>
              <option value="1">1st</option>
              <option value="2">2nd</option>
              <option value="3">3rd</option>
              <option value="4">4th</option>
              <option value="5">5th</option>
              <option value="6">6th</option>
              <option value="7">7th</option>
              <option value="8">8th</option>
            </select>
          </div>

          <div class="form-row">
            <label for="exam">Exam:</label>
            <select id="exam" name="Exam" required>
              <option value="">---Select---</option>
              <option value="Mid">Mid</option>
              <option value="End">End</option>
            </select>
          </div>

          <div class="form-row">
            <label for="studentid">Student Id:</label>
            <input id="studentid" type="text" name="StudentId" placeholder="Enter Your ID" required />
          </div>

          <div class="form-row">
            <button type="submit" class="submit-btn">Get Result</button>
          </div>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
