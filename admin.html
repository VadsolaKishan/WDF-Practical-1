<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard | CHARUSAT</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header>
    <h1 class="flip-in">Admin Dashboard</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="event.html">Events</a>
      <a href="about.html">About</a>
      <a href="feedback.html">Feedback</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
  </header>

  <section class="admin-container">
    <div class="admin-card fade-up">
      <h2>Manage Students</h2>
      <p>View, edit, or delete student records in the portal.</p>
      <button class="admin-btn">Open Panel</button>
    </div>

    <div class="admin-card fade-up delay-1">
      <h2>View Feedback</h2>
      <p>Analyze suggestions and concerns submitted by students.</p>
      <button class="admin-btn">View Feedback</button>
    </div>

    <div class="admin-card fade-up delay-2">
      <h2>Update Results</h2>
      <p>Publish or modify student examination results.</p>
      <button class="admin-btn">Manage Results</button>
    </div>
  </section>
</body>
</html>
